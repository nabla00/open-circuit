---
layout: default
---
<section class="search-section" aria-label="Search blog entries">
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input
      type="search"
      id="search-input"
      class="search-input"
      placeholder="Search posts..."
      autocomplete="off"
      aria-label="Search blog posts"
    />
    <button type="button" id="clear-search" class="clear-btn" hidden aria-label="Clear search">Clear</button>
  </div>
</section>

<section id="post-list" class="post-list" aria-label="Blog entries">
  {% for post in site.posts %}
    <a class="post-card" href="{{ post.url | relative_url }}">
      <time class="post-card-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
      <h2 class="post-card-title">{{ post.title }}</h2>
      <p class="post-card-description">{{ post.description }}</p>
    </a>
  {% endfor %}
  <p id="no-results" class="status-message" hidden>No matching posts found.</p>
</section>

<script>
  (function () {
    const input = document.getElementById("search-input");
    const clearBtn = document.getElementById("clear-search");
    const cards = Array.from(document.querySelectorAll(".post-card"));
    const noResults = document.getElementById("no-results");

    function filter() {
      const q = input.value.trim().toLowerCase();
      clearBtn.hidden = q.length === 0;
      let visible = 0;

      cards.forEach(function (card) {
        const match = !q || card.textContent.toLowerCase().includes(q);
        card.hidden = !match;
        if (match) visible++;
      });

      noResults.hidden = visible > 0;
    }

    input.addEventListener("input", filter);
    clearBtn.addEventListener("click", function () {
      input.value = "";
      input.focus();
      filter();
    });
  })();
</script>
