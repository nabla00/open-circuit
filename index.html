<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Blog</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-title">My Blog</a>
      <p class="site-tagline">Notes, guides, and thoughts hosted on GitHub Pages.</p>
    </div>
  </header>

  <main class="container">
    <section class="search-section" aria-label="Search blog entries">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Search posts by title, topic, or tag... (press /)"
          autocomplete="off"
          aria-label="Search blog posts"
        />
        <button type="button" id="clear-search" class="clear-btn" hidden aria-label="Clear search">Clear</button>
      </div>
      <div class="filter-bar">
        <div id="tag-filters" class="tag-filters" role="group" aria-label="Filter by tag"></div>
        <span id="results-count" class="results-count" aria-live="polite"></span>
      </div>
    </section>

    <section id="post-list" class="post-list" aria-label="Blog entries">
      <p class="status-message">Loading posts...</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Built with plain HTML, CSS, and JavaScript for GitHub Pages.</p>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
